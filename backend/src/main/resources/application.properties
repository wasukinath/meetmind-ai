spring.application.name=meeting-summarizer

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/meetingsummarizer;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

groq.api.key=${GROQ_API_KEY:}
groq.api.base-url=https://api.groq.com/openai/v1
groq.transcription.model=whisper-large-v3
groq.chat.model=openai/gpt-oss-120b

app.cors.allowed-origins=http://localhost:5173